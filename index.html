<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">

  <p class="sub">

    下第 4 顆時，自己最舊的那顆會消失
  </p>
  <div class="layout">
    <div class="main">
      <div class="players">
        <button class="chip you active" id="chip-human-first" type="button" title="點擊設定由你先手">你 <b>X</b> · 先手</button>
        <button class="chip ai" id="chip-ai-first" type="button" title="點擊設定由電腦先手">電腦 <b>O</b></button>
      </div>
      <div class="board" id="board">
        <button class="cell" type="button" data-i="0"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="1"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="2"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="3"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="4"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="5"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="6"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="7"><span class="mark"></span><span class="badge"></span></button>
        <button class="cell" type="button" data-i="8"><span class="mark"></span><span class="badge"></span></button>
      </div>
      <div class="status">
        <div class="turn" id="turn"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="footer">
        <span id="moves">已下 0 手</span>
        <div class="footer-actions">
          <button id="hint-btn" class="btn-action" type="button" title="顯示最佳落子提示">💡 提示</button>
          <button id="undo-btn" class="btn-action" type="button" title="退回上一手">↩ 悔棋</button>

      <div class="log-title">落子紀錄 <span id="log-count">0</span></div>

    </div>

<script>
(function () {
  'use strict';

  // ====== 常數 ======
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  const LINE_MASKS = LINES.map(([a,b,c]) => (1<<a)|(1<<b)|(1<<c));
  const POS_NAMES = ['左上','上中','右上','左中','中心','右中','左下','下中','右下'];
  const MAX_PER_PLAYER = 3;
  const N_HIST = 8740;

  // ====== 編碼工具 ======
  function encHist(h) {
    let v = h.length;
    for (let i = 0; i < h.length; i++) v |= h[i] << (2 + i * 4);
    return v;
  }
  function histMaskVal(v) {
    const len = v & 3;
    let m = 0;
    for (let i = 0; i < len; i++) m |= 1 << ((v >> (2 + i * 4)) & 15);
    return m;
  }
  function histMask(h) {
    return histMaskVal(encHist(h));
  }
  function hasLine(m) {
    for (let i = 0; i < 8; i++) if ((m & LINE_MASKS[i]) === LINE_MASKS[i]) return true;
    return false;
  }
  function hasLineArr(arr) {
    if (arr.length < 3) return false;
    let m = 0;
    for (const p of arr) m |= 1 << p;
    return hasLine(m);
  }
  function keyOf(xhV, ohV, t) {
    return (xhV * N_HIST + ohV) * 2 + t;
  }

  // ====== 逆向分析求解引擎 (Retrograde Analysis) ======
  // 窮舉計算全部 116,074 個盤面狀態的勝負與極限步數
  const keyToId = new Map();
  const states = [];
  let status, dist;
  let solverReady = false;

  function initSolver() {
    if (solverReady) return;
    const rootKey = keyOf(0, 0, 0);
    keyToId.set(rootKey, 0);
    states.push({ xhV: 0, ohV: 0, t: 0, moves: [] });

    let qHead = 0;
    while (qHead < states.length) {
      const cur = states[qHead++];
      const myV = cur.t === 0 ? cur.xhV : cur.ohV;
      const myLen = myV & 3;
      const occ = histMaskVal(cur.xhV) | histMaskVal(cur.ohV);
      const p0 = (myV >> 2) & 15;
      const p1 = (myV >> 6) & 15;
      const p2 = (myV >> 10) & 15;

      for (let cell = 0; cell < 9; cell++) {
        if (occ & (1 << cell)) continue;
        let newMyV, newMask;
        if (myLen === 0) {
          newMyV = 1 | (cell << 2);
          newMask = 1 << cell;
        } else if (myLen === 1) {
          newMyV = 2 | (p0 << 2) | (cell << 6);
          newMask = (1 << p0) | (1 << cell);
        } else if (myLen === 2) {
          newMyV = 3 | (p0 << 2) | (p1 << 6) | (cell << 10);
          newMask = (1 << p0) | (1 << p1) | (1 << cell);
        } else {
          newMyV = 3 | (p1 << 2) | (p2 << 6) | (cell << 10);
          newMask = (1 << p1) | (1 << p2) | (1 << cell);
        }

        if (hasLine(newMask)) {
          cur.moves.push({ cell, win: true });
          continue;
        }

        const nxhV = cur.t === 0 ? newMyV : cur.xhV;
        const nohV = cur.t === 0 ? cur.ohV : newMyV;
        const nT = 1 - cur.t;
        const nKey = keyOf(nxhV, nohV, nT);

        let nextId = keyToId.get(nKey);
        if (nextId === undefined) {
          nextId = states.length;
          keyToId.set(nKey, nextId);
          states.push({ xhV: nxhV, ohV: nohV, t: nT, moves: [] });
        }
        cur.moves.push({ cell, win: false, nextId });
      }
    }

    const N = states.length;
    const parentCount = new Int32Array(N);
    for (let i = 0; i < N; i++) {
      for (const m of states[i].moves) {
        if (!m.win) parentCount[m.nextId]++;
      }
    }

    const parentOffsets = new Int32Array(N + 1);
    for (let i = 0; i < N; i++) parentOffsets[i + 1] = parentOffsets[i] + parentCount[i];
    const parentArr = new Int32Array(parentOffsets[N]);
    const curParentIdx = new Int32Array(parentOffsets);

    for (let i = 0; i < N; i++) {
      for (const m of states[i].moves) {
        if (!m.win) parentArr[curParentIdx[m.nextId]++] = i;
      }
    }

    status = new Int8Array(N);
    dist = new Int16Array(N);
    const remMoves = new Int8Array(N);
    const propQ = new Int32Array(N);
    let pTail = 0;

    for (let i = 0; i < N; i++) {
      const mvs = states[i].moves;
      let hasW = false;
      for (const m of mvs) {
        if (m.win) { hasW = true; break; }
      }
      if (hasW) {
        status[i] = 1;
        dist[i] = 1;
        propQ[pTail++] = i;
      } else {
        remMoves[i] = mvs.length;
      }
    }

    let pHead = 0;
    while (pHead < pTail) {
      const u = propQ[pHead++];
      const s = status[u];
      const d = dist[u];
      const pStart = parentOffsets[u];
      const pEnd = parentOffsets[u + 1];

      if (s === -1) {
        for (let p = pStart; p < pEnd; p++) {
          const v = parentArr[p];
          if (status[v] === 0) {
            status[v] = 1;
            dist[v] = d + 1;
            propQ[pTail++] = v;
          } else if (status[v] === 1 && d + 1 < dist[v]) {
            dist[v] = d + 1;
          }
        }
      } else if (s === 1) {
        for (let p = pStart; p < pEnd; p++) {
          const v = parentArr[p];
          if (status[v] === 0) {
            remMoves[v]--;
            if (d + 1 > dist[v]) dist[v] = d + 1;
            if (remMoves[v] === 0) {
              status[v] = -1;
              propQ[pTail++] = v;
            }
          }
        }
      }
    }
    solverReady = true;
  }

  // 找當前玩家最佳落子（極限頑抗 + 必勝最速反殺）
  function bestMove(xh, oh, t) {
    if (!solverReady) initSolver();
    const key = keyOf(encHist(xh), encHist(oh), t);
    const id = keyToId.get(key);
    if (id === undefined) {
      const occ = histMask(xh) | histMask(oh);
      const legal = [];
      for (let c = 0; c < 9; c++) if (!(occ & (1 << c))) legal.push(c);
      return { cell: legal[Math.floor(Math.random() * legal.length)], type: 'draw', steps: 0 };
    }
    const cur = states[id];

    // 1. 立即獲勝手
    const winMoves = cur.moves.filter(m => m.win);
    if (winMoves.length > 0) {
      return { cell: winMoves[Math.floor(Math.random() * winMoves.length)].cell, type: 'win', steps: 1 };
    }

    // 2. 必勝走法（對手為 -1，選擇最速獲勝 min distance）
    const winningMoves = [];
    let minD = Infinity;
    for (const m of cur.moves) {
      if (status[m.nextId] === -1) {
        const d = dist[m.nextId];
        if (d < minD) {
          minD = d;
          winningMoves.length = 0;
          winningMoves.push(m.cell);
        } else if (d === minD) {
          winningMoves.push(m.cell);
        }
      }
    }
    if (winningMoves.length > 0) {
      return { cell: winningMoves[Math.floor(Math.random() * winningMoves.length)], type: 'win', steps: minD + 1 };
    }

    // 3. 和局走法（對手為 0，保持不敗）
    const drawMoves = cur.moves.filter(m => status[m.nextId] === 0).map(m => m.cell);
    if (drawMoves.length > 0) {
      return { cell: drawMoves[Math.floor(Math.random() * drawMoves.length)], type: 'draw', steps: 0 };
    }

    // 4. 處於劣勢時極限頑抗：選擇對手需要最長步數才能獲勝的走法 (max distance)，確保撐滿 13 步才輸
    let maxD = -1;
    const losingMoves = [];
    for (const m of cur.moves) {
      const d = dist[m.nextId];
      if (d > maxD) {
        maxD = d;
        losingMoves.length = 0;
        losingMoves.push(m.cell);
      } else if (d === maxD) {
        losingMoves.push(m.cell);
      }
    }
    return { cell: losingMoves[Math.floor(Math.random() * losingMoves.length)], type: 'loss', steps: maxD + 1 };
  }

  // 背景初始化求解引擎
  setTimeout(initSolver, 0);

  // ====== UI ======
  const boardEl        = document.getElementById('board');
  const turnEl         = document.getElementById('turn');
  const hintEl         = document.getElementById('hint');
  const movesEl        = document.getElementById('moves');
  const resetBtn       = document.getElementById('reset');
  const hintBtn        = document.getElementById('hint-btn');
  const undoBtn        = document.getElementById('undo-btn');
  const logBodyEl      = document.getElementById('log-body');
  const logCountEl     = document.getElementById('log-count');
  const chipHumanFirst = document.getElementById('chip-human-first');
  const chipAiFirst    = document.getElementById('chip-ai-first');
  const cellEls        = [...boardEl.querySelectorAll('.cell')];
  const confettiCanvas = document.getElementById('confetti-canvas');

  let xHist, oHist, turn, moveCount, gameOver, winner, winLine, thinking;
  let moveHistory = [];
  let humanPlayer = 'X'; // 'X' = 玩家先手, 'O' = 電腦先手

  function updatePlayerChips() {
    if (humanPlayer === 'X') {
      chipHumanFirst.className = 'chip you active';
      chipHumanFirst.innerHTML = '你 <b>X</b> · 先手';
      chipAiFirst.className = 'chip ai';
      chipAiFirst.innerHTML = '電腦 <b>O</b>';
    } else {
      chipHumanFirst.className = 'chip you';
      chipHumanFirst.innerHTML = '你 <b>O</b>';
      chipAiFirst.className = 'chip ai active ai-active';
      chipAiFirst.innerHTML = '電腦 <b>X</b> · 先手';
    }
  }

  function clearSuggestion() {
    cellEls.forEach(el => el.classList.remove('suggested'));
  }

  function triggerConfetti() {
    if (!confettiCanvas) return;
    const ctx = confettiCanvas.getContext('2d');
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;

    const pieces = [];
    const colors = ['#38bdf8', '#fb923c', '#4ade80', '#f472b6', '#facc15', '#a78bfa'];
    for (let i = 0; i < 70; i++) {
      pieces.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 200,
        y: confettiCanvas.height * 0.4 + (Math.random() - 0.5) * 100,
        vx: (Math.random() - 0.5) * 12,
        vy: Math.random() * -12 - 4,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 10,
        life: 1
      });
    }

    const start = performance.now();
    function render(now) {
      const elapsed = (now - start) / 1000;
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;
      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.vx *= 0.99;
        p.rot += p.vrot;
        p.life = Math.max(0, 1 - elapsed / 2.5);
        if (p.life > 0 && p.y < confettiCanvas.height + 20) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
      }
      if (alive) {
        requestAnimationFrame(render);
      } else {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }
    requestAnimationFrame(render);
  }

  function reset() {
    xHist = []; oHist = [];
    moveHistory = [];
    turn = 0;                 // 0 = X, 1 = O
    moveCount = 0; gameOver = false;
    winner = null; winLine = null; thinking = false;

    clearSuggestion();
    cellEls.forEach(el => {
      el.className = 'cell';
      el.querySelector('.mark').textContent = '';
      el.querySelector('.badge').textContent = '';
    });
    logBodyEl.innerHTML = '<div class="log-empty">尚未開始</div>';
    logCountEl.textContent = '0';
    updatePlayerChips();
    updateUI();

    // 如果電腦執先手 (X)，開局立即下第一手
    if (humanPlayer === 'O') {
      aiPlay();
    }
  }

  function getOwner(cell) {
    const xi = xHist.indexOf(cell);
    if (xi !== -1) return { player: 'X', age: xi + 1 };
    const oi = oHist.indexOf(cell);
    if (oi !== -1) return { player: 'O', age: oi + 1 };
    return null;
  }
  function findWinLine(arr) {
    const s = new Set(arr);
    for (const [a,b,c] of LINES) if (s.has(a) && s.has(b) && s.has(c)) return [a,b,c];
    return null;
  }
  function addLog(player, cell, no) {
    const empty = logBodyEl.querySelector('.log-empty');
    if (empty) empty.remove();
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML =
      `<span class="log-num">${no}.</span>` +
      `<span class="log-player ${player.toLowerCase()}">${player}</span>` +
      `<span class="log-arrow">→</span>` +
      `<span class="log-pos">${POS_NAMES[cell]}</span>`;
    logBodyEl.appendChild(row);
    logBodyEl.scrollTop = logBodyEl.scrollHeight;
    logCountEl.textContent = String(no);
  }

  function updateUI() {
    cellEls.forEach(el => el.classList.remove('oldest', 'winning'));
    for (let i = 0; i < 9; i++) {
      const el = cellEls[i];
      const d = getOwner(i);
      el.classList.remove('x', 'o');
      const mark = el.querySelector('.mark');
      const badge = el.querySelector('.badge');
      if (d) {
        el.classList.add(d.player.toLowerCase());
        mark.textContent = d.player;
        badge.textContent = d.age;
      } else { mark.textContent = ''; badge.textContent = ''; }
    }
    if (winLine) for (const i of winLine) cellEls[i].classList.add('winning');
    if (!gameOver) {
      if (xHist.length >= 3) cellEls[xHist[0]].classList.add('oldest');
      if (oHist.length >= 3) cellEls[oHist[0]].classList.add('oldest');
    }

    if (winner) {
      const isYou = winner === humanPlayer;
      const name = isYou ? '你' : '電腦';
      turnEl.innerHTML = `<span class="${winner.toLowerCase()}">${name}</span> 獲勝！`;
      hintEl.textContent = '按「重新開始」再玩一局';
    } else if (gameOver) {
      turnEl.textContent = '和局';
      hintEl.textContent = '按「重新開始」再玩一局';
    } else if (thinking) {
      const aiSymbol = humanPlayer === 'X' ? 'o' : 'x';
      turnEl.innerHTML = `<span class="${aiSymbol}">電腦</span> 思考中<span class="dots"></span>`;
      hintEl.textContent = '';
    } else {
      const myHist = humanPlayer === 'X' ? xHist : oHist;
      turnEl.innerHTML = `輪到 <span class="${humanPlayer.toLowerCase()}">你</span> 落子`;
      if (myHist.length >= 3) hintEl.textContent = '⚠ 你落下後，自己最舊的棋子會消失';
      else hintEl.textContent = `棋盤上你還可以再放 ${3 - myHist.length} 顆棋子`;
    }

    movesEl.textContent = `已下 ${moveCount} 手`;
    boardEl.classList.toggle('locked', thinking || gameOver);

    if (hintBtn) hintBtn.disabled = gameOver || thinking;
    if (undoBtn) {
      const hasHumanMoves = moveHistory.some(m => m.player === humanPlayer);
      undoBtn.disabled = thinking || !hasHumanMoves;
    }
  }

  function applyMove(player, cell) {
    moveCount++;
    const hist = player === 'X' ? xHist : oHist;
    hist.push(cell);
    if (hist.length > 3) hist.shift();
    moveHistory.push({
      player,
      cell,
      xHist: [...xHist],
      oHist: [...oHist],
      moveCount,
      turn
    });
    addLog(player, cell, moveCount);
  }

  function endIfWin(player) {
    const arr = player === 'X' ? xHist : oHist;
    if (hasLineArr(arr)) {
      winner = player;
      winLine = findWinLine(arr);
      gameOver = true;
      if (winner === humanPlayer) {
        triggerConfetti();
      }
      return true;
    }
    return false;
  }

  function rebuildLogPanel() {
    logBodyEl.innerHTML = '';
    if (moveHistory.length === 0) {
      logBodyEl.innerHTML = '<div class="log-empty">尚未開始</div>';
      logCountEl.textContent = '0';
      return;
    }
    for (const item of moveHistory) {
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML =
        `<span class="log-num">${item.moveCount}.</span>` +
        `<span class="log-player ${item.player.toLowerCase()}">${item.player}</span>` +
        `<span class="log-arrow">→</span>` +
        `<span class="log-pos">${POS_NAMES[item.cell]}</span>`;
      logBodyEl.appendChild(row);
    }
    logBodyEl.scrollTop = logBodyEl.scrollHeight;
    logCountEl.textContent = String(moveHistory.length);
  }

  function showHint() {
    if (gameOver || thinking) return;
    const humanTurn = humanPlayer === 'X' ? 0 : 1;
    if (turn !== humanTurn) return;

    clearSuggestion();
    const res = bestMove(xHist, oHist, humanTurn);
    if (!res || res.cell === undefined) return;

    cellEls[res.cell].classList.add('suggested');
    const posName = POS_NAMES[res.cell];
    if (res.type === 'win') {
      const rounds = Math.ceil(res.steps / 2);
      hintEl.innerHTML = `💡 提示：建議下在 <b>${posName}</b>，預計 ${rounds} 步內必勝！`;
    } else if (res.type === 'draw') {
      hintEl.innerHTML = `💡 提示：建議下在 <b>${posName}</b>，可保持和局不敗`;
    } else {
      hintEl.innerHTML = `💡 提示：建議下在 <b>${posName}</b>，爭取最長抵抗`;
    }
  }

  function undo() {
    if (thinking || moveHistory.length === 0) return;
    clearSuggestion();

    let stepsToUndo = 0;
    if (gameOver) {
      const last = moveHistory[moveHistory.length - 1];
      stepsToUndo = (last.player === humanPlayer) ? 1 : Math.min(2, moveHistory.length);
    } else {
      stepsToUndo = Math.min(2, moveHistory.length);
    }

    while (stepsToUndo > 0 && moveHistory.length > 0) {
      moveHistory.pop();
      stepsToUndo--;
    }

    gameOver = false;
    winner = null;
    winLine = null;

    if (moveHistory.length === 0) {
      xHist = [];
      oHist = [];
      moveCount = 0;
      turn = 0;
    } else {
      const last = moveHistory[moveHistory.length - 1];
      xHist = [...last.xHist];
      oHist = [...last.oHist];
      moveCount = last.moveCount;
      turn = (last.player === 'X') ? 1 : 0;
    }

    rebuildLogPanel();
    updateUI();
  }

  function aiPlay() {
    if (gameOver) return;
    thinking = true;
    updateUI();

    setTimeout(() => {
      if (gameOver) { thinking = false; return; }
      const aiPlayer = humanPlayer === 'X' ? 'O' : 'X';
      const aiTurn = aiPlayer === 'X' ? 0 : 1;
      const { cell: move } = bestMove(xHist, oHist, aiTurn);
      applyMove(aiPlayer, move);
      cellEls[move].classList.add('placing');
      setTimeout(() => cellEls[move].classList.remove('placing'), 300);

      endIfWin(aiPlayer);
      thinking = false;
      turn = 1 - aiTurn;
      if (!gameOver && moveCount >= 300) gameOver = true;
      updateUI();
    }, 200);
  }

  function humanPlay(cell) {
    if (gameOver || thinking) return;
    const humanTurn = humanPlayer === 'X' ? 0 : 1;
    if (turn !== humanTurn) return;
    if (getOwner(cell)) return;

    clearSuggestion();
    applyMove(humanPlayer, cell);
    cellEls[cell].classList.add('placing');
    setTimeout(() => cellEls[cell].classList.remove('placing'), 300);

    if (endIfWin(humanPlayer)) { updateUI(); return; }

    turn = 1 - humanTurn;
    aiPlay();
  }

  cellEls.forEach(el => {
    el.addEventListener('click', () => humanPlay(Number(el.dataset.i)));
  });
  resetBtn.addEventListener('click', reset);
  hintBtn.addEventListener('click', showHint);
  undoBtn.addEventListener('click', undo);

  chipHumanFirst.addEventListener('click', () => {
    if (humanPlayer === 'X') return;
    humanPlayer = 'X';
    reset();
  });
  chipAiFirst.addEventListener('click', () => {
    if (humanPlayer === 'O') return;
    humanPlayer = 'O';
    reset();
  });

  reset();
})();
</script>
